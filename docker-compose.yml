name: rinha-backend

x-api: &api
  image: rinha-backend-nest:local
  build: .
  init: true
  environment:
    NODE_ENV: production
    PORT: "3000"
    DATABASE_URL: postgres://rinha:rinha@db:5432/rinha
    DB_POOL_SIZE: "15"
    SEARCH_MODE: ${SEARCH_MODE:-indexed}
    CACHE_SIZE: ${CACHE_SIZE:-10000}
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 5s
    start_period: 10s
    retries: 10
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  deploy:
    resources:
      limits:
        cpus: "0.35"
        memory: 384M

services:
  api1:
    <<: *api
  api2:
    <<: *api
  nginx:
    image: nginx:1.28-bookworm@sha256:552e7481ca93ffccd046aa658dbbed22caefbc09c66fa7cd247cbb90b8a5c609
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 256M
  db:
    image: postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
    environment:
      POSTGRES_USER: rinha
      POSTGRES_PASSWORD: rinha
      POSTGRES_DB: rinha
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=384MB
      - -c
      - effective_cache_size=1024MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - random_page_cost=1.1
      - -c
      - checkpoint_timeout=15min
      - -c
      - max_wal_size=1GB
      - -c
      - jit=off
    volumes:
      - pessoas:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rinha -d rinha"]
      interval: 3s
      timeout: 3s
      retries: 20
    shm_size: 384M
    deploy:
      resources:
        limits:
          cpus: "0.65"
          memory: 1664M

volumes:
  pessoas:
