# Reproduce the resource allocation of the first two measured configurations.
# Apply after the base Compose (and after the optional host network override).
services:
  api1:
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: 384M
  api2:
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: 384M
  db:
    deploy:
      resources:
        limits:
          cpus: "0.65"
          memory: 1792M
  nginx:
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 128M
